<title>AgentForge PoC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 상단 단계 바 + 좌측 작업 패널 + 우측 생성 파일 미리보기 (작업대 구조) */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EBEEF3; --ink:#15202B; --muted:#5A6676; --line:#D8DEE6;
  --accent:#0E6E66; --accent-ink:#FFFFFF; --accent-soft:#DDF0EE;
  --verify:#A2560B; --verify-soft:#F8EBDD;
  --good:#1E7A3C; --warn:#9A6400; --bad:#B42318;
  --code-bg:#101820; --code-ink:#D5DEE8; --code-dim:#7C8B9C;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#151D26; --sunk:#1B2531; --ink:#E3E9F0; --muted:#93A1B2; --line:#2A3644;
  --accent:#3FB8AC; --accent-ink:#06221F; --accent-soft:#12302D;
  --verify:#E0A15A; --verify-soft:#33240F;
  --good:#5CC27F; --warn:#E3B341; --bad:#F0786B;
  --code-bg:#0A0F15; --code-ink:#D5DEE8; --code-dim:#6F7E90; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D26; --sunk:#1B2531; --ink:#E3E9F0; --muted:#93A1B2; --line:#2A3644;
  --accent:#3FB8AC; --accent-ink:#06221F; --accent-soft:#12302D;
  --verify:#E0A15A; --verify-soft:#33240F;
  --good:#5CC27F; --warn:#E3B341; --bad:#F0786B;
  --code-bg:#0A0F15; --code-ink:#D5DEE8; --code-dim:#6F7E90; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
.app{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ver{background:var(--verify-soft);color:var(--verify)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.small{padding:4px 9px;font-size:12.5px}
button:disabled{opacity:.45;cursor:not-allowed}
nav.steps{overflow-x:auto}
nav.steps ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;min-width:max-content}
nav.steps button{display:flex;align-items:center;gap:8px;padding:8px 12px;background:transparent;border-color:transparent;color:var(--muted)}
nav.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
nav.steps button[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
nav.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
nav.steps .warnDot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
main.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,470px);gap:14px;align-items:start}
@media (max-width:1060px){main.work{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{margin:0;font-size:18px;text-wrap:balance}
.panel h3{margin:0;font-size:14px}
.lead{margin:0;color:var(--muted);max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
td input[type=text],td select{padding:6px 8px;font-size:13px}
textarea{font-family:var(--f-ui);font-size:14px;line-height:1.6;resize:vertical;min-height:190px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;border-radius:0;padding:6px 12px;font-weight:700}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.toggle input{margin-top:4px;accent-color:var(--accent)}
.toggle b{display:block;font-size:13.5px}
.toggle span{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.note b{color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px}
/* routine */
.flow{overflow-x:auto;padding-bottom:4px}
.flow .seq{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 6px}
.st{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-width:112px;display:flex;flex-direction:column;gap:2px}
.st .k{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.st b{font-size:13.5px}
.st small{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.st.opt{border-style:dashed}
.st.off{opacity:.45;text-decoration:line-through}
.st.fin{border:2px solid var(--accent);background:var(--accent-soft)}
.ar{align-self:center;color:var(--muted)}
.par{border:2px solid var(--accent);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.par .lbl{font-size:11.5px;font-weight:700;color:var(--accent)}
.par .pr{display:flex;gap:6px;align-items:center;font-size:12px;font-family:var(--f-mono)}
.par .d{border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--surface)}
.par .r{border:1px solid var(--verify);border-radius:6px;padding:2px 6px;background:var(--verify-soft);color:var(--verify)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.t td.gate{font-size:12px;color:var(--muted);min-width:180px}
.tw{overflow-x:auto}
.layer{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.layer h3 .chip{margin-left:6px}
.sk{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.sk input{margin-top:4px;accent-color:var(--accent)}
.sk code,.mono{font-family:var(--f-mono);font-size:12px}
.mk-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mk-item .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.flag{font-size:12px;color:var(--bad)}
/* tmux preview */
.tmux{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-mono);font-size:11.5px;overflow-x:auto}
.tmux .wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tmux .win{border:1px solid #2b3a4a;border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px}
.tmux .wn{color:var(--code-dim)}
.tmux .panes{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tmux .pane{border:1px solid #3a4c60;border-radius:4px;padding:6px;min-height:46px}
.tmux .pane.d{border-color:#3FB8AC;color:#9fe3db}
.tmux .pane.r{border-color:#E0A15A;color:#f1c896}
.tmux .pane.w{grid-column:1 / -1;color:#c9d6e3}
.tmux .bar{background:#1f6f68;color:#e9fffb;padding:2px 8px;border-radius:4px}
/* checks */
.ck{display:flex;flex-direction:column;gap:6px}
.ck div{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.ck .i{font-weight:700;width:16px;flex:none;text-align:center}
.ck .ok .i{color:var(--good)} .ck .wa .i{color:var(--warn)} .ck .er .i{color:var(--bad)} .ck .in .i{color:var(--muted)}
ol.next{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px}
ol.next code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
/* preview */
aside.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:1060px){aside.preview{position:static}}
.tree{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;font-family:var(--f-mono);font-size:12px}
.tree button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:transparent;padding:3px 6px;text-align:left;border-radius:5px;color:var(--ink)}
.tree button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree .x{color:var(--muted)}
.tree .ai{color:var(--verify)}
pre.view{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:11.8px;line-height:1.55;max-height:56vh;overflow:auto;white-space:pre}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.plan{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>AgentForge</b><span class="chip acc">화면 PoC v2</span><span class="sub">Claude Code 멀티 에이전트 개발환경 생성기</span></div>
    <div class="row"><span class="sub" id="hdrSum"></span><button class="primary" id="hdrZip" type="button">ZIP 다운로드</button></div>
  </header>
  <nav class="steps" aria-label="생성 단계"><ol id="steps"></ol></nav>
  <main class="work">
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="preview" aria-label="생성 파일 미리보기">
      <div class="row" style="justify-content:space-between"><h3 style="margin:0">생성될 파일</h3><span class="chip" id="fileCount"></span></div>
      <div class="legend"><span><span class="x">755</span> 실행 파일</span><span><span class="ai">AI</span> /forge-* 가 내용을 채움</span></div>
      <div class="tree" id="tree"></div>
      <div class="row" style="justify-content:space-between"><span class="mono sub" id="selPath"></span><button type="button" class="small" id="copyBtn">복사</button></div>
      <pre class="view" id="view"></pre>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const STATIC = {"wait-and-review.sh": "#!/usr/bin/env bash\n# scripts/wait-and-review.sh : 신호 파일을 감시해 설계 검토 → 구현 → 코드 검토 → 반려 루프를 중계한다.\nset -uo pipefail\nroot=\"$(git rev-parse --show-toplevel)\"; cd \"$root\" || exit 1\nname=\"$(basename \"$root\")\"\nn=\"$(jq -r '.developers' .agentforge/forge.config.json)\"\nmax=\"$(jq -r '.maxRejects // 3' .agentforge/forge.config.json)\"\nsig=\"$root/.agentforge/signals\"; panes=\"$root/.agentforge/panes\"\n\nsay() {  # say <에이전트> <메시지> : 해당 pane 에 문장을 입력하고 Enter\n  local p; p=\"$(cat \"$panes/$1\")\"\n  tmux send-keys -t \"$p\" -l \"$2\"; sleep 0.5; tmux send-keys -t \"$p\" Enter\n  echo \"$(date +%H:%M:%S) → $1: $2\"\n}\ntake() { [ -f \"$sig/$1\" ] && mv \"$sig/$1\" \"$sig/$1.$(date +%s)\"; }   # 신호 소비(이력 보존)\ncount() { find \"$sig\" -maxdepth 1 -name \"$1.*\" | wc -l; }\n\nout_of_scope() {  # out_of_scope <i> : 담당 범위 밖 변경 파일 출력\n  local i=\"$1\" wt list f p hit\n  wt=\"$(cd \"$root/..\" && pwd)/$name-dev$i\"; list=\"$wt/.claude/devs/dev-$i.paths\"\n  { git -C \"$wt\" diff --name-only develop...HEAD; git -C \"$wt\" status --porcelain --untracked-files=all | cut -c4-; } | sort -u |\n  while IFS= read -r f; do\n    [ -z \"$f\" ] && continue\n    hit=0\n    while IFS= read -r p; do\n      p=\"${p%%#*}\"; p=\"${p//[[:space:]]/}\"; [ -z \"$p\" ] && continue\n      case \"$f\" in \"$p\"*) hit=1; break;; esac\n    done < \"$list\"\n    [ \"$hit\" -eq 0 ] && echo \"$f\"\n  done\n}\n\necho \"감시 시작: 개발자 ${n}명, 반려 한도 ${max}회 (중지: Ctrl-c)\"\nwhile :; do\n  passed=0\n  for i in $(seq 1 \"$n\"); do\n    if take \"design-$i.done\"; then\n      say \"review-$i\" \"설계 검토: docs/design/detail/dev-$i.md 를 검토하고 design-$i.pass 또는 design-$i.reject 신호를 만드세요.\"\n    fi\n    if take \"design-$i.pass\"; then\n      say \"dev-$i\" \"설계 승인. 테스트를 먼저 쓰고 구현하세요. 끝나면 커밋하고 dev-$i.done 신호를 만드세요.\"\n    fi\n    if take \"design-$i.reject\"; then\n      say \"dev-$i\" \"설계 반려. docs/review/dev-$i.md 를 읽고 상세 설계를 고친 뒤 design-$i.done 신호를 다시 만드세요.\"\n    fi\n    if [ -f \"$sig/dev-$i.done\" ]; then\n      bad=\"$(out_of_scope \"$i\")\"\n      take \"dev-$i.done\"\n      if [ -n \"$bad\" ]; then\n        say \"dev-$i\" \"담당 범위 밖 변경이 있습니다: $(echo \"$bad\" | tr '\\n' ' ') 되돌린 뒤 dev-$i.done 을 다시 만드세요.\"\n      else\n        say \"review-$i\" \"코드 검토: 테스트를 실행하고 review-$i.pass 또는 review-$i.reject 신호를 만드세요.\"\n      fi\n    fi\n    if take \"review-$i.reject\"; then\n      if [ \"$(count \"review-$i.reject\")\" -ge \"$max\" ]; then\n        echo \"!! dev-$i 반려 ${max}회. 자동 반복을 멈춥니다. 사람이 판단하세요.\"\n        tmux display-message -t \"$name\" \"dev-$i 반려 ${max}회: 사람 확인 필요\" 2>/dev/null || true\n        touch \"$sig/dev-$i.blocked\"\n      else\n        say \"dev-$i\" \"코드 반려. docs/review/dev-$i.md 의 지적 사항만 고치고 커밋한 뒤 dev-$i.done 을 다시 만드세요.\"\n      fi\n    fi\n    [ -f \"$sig/review-$i.pass\" ] && { touch \"$sig/review-$i.passed\"; take \"review-$i.pass\"; echo \"✓ dev-$i 통과\"; }\n    [ -f \"$sig/review-$i.passed\" ] && passed=$((passed + 1))\n  done\n  if [ \"$passed\" -eq \"$n\" ]; then echo \"전원 통과. 다음: bash scripts/integrate.sh\"; exit 0; fi\n  sleep 10\ndone\n", "setup.sh": "#!/usr/bin/env bash\n# scripts/setup.sh : 압축을 푼 뒤 한 번 실행한다. 도구 확인, 실행 권한, 키 파일, git 첫 커밋.\nset -euo pipefail\ncd \"$(dirname \"$0\")/..\"\nmiss=0\nfor t in git tmux jq claude; do\n  command -v \"$t\" >/dev/null || { echo \"필요 도구 없음: $t\"; miss=1; }\ndone\nif [ \"$miss\" -ne 0 ]; then\n  echo \"설치 후 다시 실행하세요. (WSL Ubuntu) sudo apt install -y git tmux jq && npm install -g @anthropic-ai/claude-code\"\n  exit 1\nfi\nfind scripts .claude/hooks -name '*.sh' -exec sed -i 's/\\r$//' {} + -exec chmod +x {} +\nmkdir -p .agentforge/signals .agentforge/panes\nif [ ! -f .agentforge/env.local ]; then\n  cp .agentforge/env.local.example .agentforge/env.local && chmod 600 .agentforge/env.local\n  echo \"생성: .agentforge/env.local  (사용하는 제공자의 주소·키를 직접 입력하세요)\"\nfi\nif [ ! -d .git ]; then\n  git init -q -b main\n  git add -A\n  git commit -qm \"[lead] AgentForge 환경 생성\" || echo \"첫 커밋 실패: git config user.name / user.email 설정 후 직접 커밋하세요\"\nfi\necho \"준비 완료. 다음 순서:\"\necho \"  1) claude            # 처음 한 번 직접 로그인\"\necho \"  2) bash scripts/run-role.sh planner   → 세션에서 /forge-init\"\n", "guard-paths.sh": "#!/usr/bin/env bash\n# .claude/hooks/guard-paths.sh\n# PreToolUse(Edit|Write): 에이전트별 담당 범위 밖 파일 수정을 막는다.\n# AF_AGENT 가 없으면(리드·순차 단계 세션) 검사하지 않는다.\nset -u\ninput=\"$(cat)\"\n[ -z \"${AF_AGENT:-}\" ] && exit 0\n\nfile=\"$(printf '%s' \"$input\" | jq -r '.tool_input.file_path // empty')\"\ncwd=\"$(printf '%s' \"$input\" | jq -r '.cwd // empty')\"\n[ -z \"$file\" ] && exit 0\n\nroot=\"$(git -C \"${cwd:-.}\" rev-parse --show-toplevel 2>/dev/null)\" || {\n  echo \"저장소를 찾지 못해 수정을 막았습니다: $file\" >&2; exit 2; }\ncase \"$file\" in /*) ;; *) file=\"${cwd:-.}/$file\";; esac\nfile=\"$(realpath -m \"$file\")\"   # ../ 우회 차단\nrel=\"${file#\"$root\"/}\"\n\nlist=\"$root/.claude/devs/$AF_AGENT.paths\"\n[ -f \"$list\" ] || { echo \"담당 범위 파일이 없습니다: $list\" >&2; exit 2; }\n\nwhile IFS= read -r p || [ -n \"$p\" ]; do\n  p=\"${p%%#*}\"; p=\"${p//[[:space:]]/}\"\n  [ -z \"$p\" ] && continue\n  case \"$rel\" in \"$p\"*) exit 0;; esac\ndone < \"$list\"\n\necho \"담당 범위 밖 파일입니다: $rel ($AF_AGENT). 수정하지 말고 report에 필요한 변경을 적은 뒤 멈추세요.\" >&2\nexit 2\n", "create-worktrees.sh": "#!/usr/bin/env bash\n# scripts/create-worktrees.sh : 개발자 수만큼 worktree 를 develop 기준으로 만든다.\nset -euo pipefail\nroot=\"$(git rev-parse --show-toplevel)\"; cd \"$root\"\nname=\"$(basename \"$root\")\"\ncfg=.agentforge/forge.config.json\nn=\"$(jq -r '.developers' \"$cfg\")\"\ninstall=\"$(jq -r '.commands.install // empty' \"$cfg\")\"\n\ngit rev-parse --verify -q develop >/dev/null || { echo \"develop 브랜치가 없습니다. 공통 개발을 먼저 끝내세요.\" >&2; exit 1; }\nmkdir -p .agentforge/signals .agentforge/panes\n\nfor i in $(seq 1 \"$n\"); do\n  wt=\"$(cd \"$root/..\" && pwd)/$name-dev$i\"\n  if [ -d \"$wt\" ]; then echo \"이미 있음: $wt\"; continue; fi\n  if git rev-parse --verify -q \"feature/dev$i\" >/dev/null; then\n    git worktree add \"$wt\" \"feature/dev$i\"\n  else\n    git worktree add -b \"feature/dev$i\" \"$wt\" develop\n  fi\n  if [ -n \"$install\" ]; then (cd \"$wt\" && bash -c \"$install\"); fi\ndone\ngit worktree list\n", "run-agents.sh": "#!/usr/bin/env bash\n# scripts/run-agents.sh : 개발자마다 tmux 창 1개(왼쪽 dev-i, 오른쪽 review-i) + 감시 창을 띄운다.\nset -euo pipefail\nroot=\"$(git rev-parse --show-toplevel)\"; cd \"$root\"\nname=\"$(basename \"$root\")\"\nn=\"$(jq -r '.developers' .agentforge/forge.config.json)\"\nsig=\"$root/.agentforge/signals\"; panes=\"$root/.agentforge/panes\"\nmkdir -p \"$sig\" \"$panes\"\n\nif tmux has-session -t \"$name\" 2>/dev/null; then\n  echo \"tmux 세션 '$name' 이 이미 있습니다. 붙기: tmux attach -t $name\" >&2; exit 1\nfi\n\n# 한 pane 에서 실행할 명령을 만든다: 제공자 설정 → 범위 변수 → claude --agent\nlaunch() {  # launch <에이전트> <작업폴더> [첫 프롬프트]\n  local a=\"$1\" dir=\"$2\" prompt=\"${3:-}\" cmd\n  cmd=\"cd $(printf '%q' \"$dir\") && source $(printf '%q' \"$root/scripts/agent-env.sh\") $a\"\n  cmd+=\" && export AF_AGENT=$a AF_SIGNALS=$(printf '%q' \"$sig\")\"\n  cmd+=\" && claude --agent $a\"\n  [ -n \"$prompt\" ] && cmd+=\" $(printf '%q' \"$prompt\")\"\n  printf '%s' \"$cmd\"\n}\n\ntmux new-session -d -s \"$name\" -n watch -c \"$root\"\nfor i in $(seq 1 \"$n\"); do\n  wt=\"$(cd \"$root/..\" && pwd)/$name-dev$i\"\n  [ -d \"$wt\" ] || { echo \"worktree 없음: $wt (create-worktrees.sh 먼저)\" >&2; exit 1; }\n  left=\"$(tmux new-window -d -P -F '#{pane_id}' -t \"$name\" -n \"dev$i\" -c \"$wt\")\"\n  right=\"$(tmux split-window -d -h -P -F '#{pane_id}' -t \"$left\" -c \"$wt\")\"\n  echo \"$left\"  > \"$panes/dev-$i\"\n  echo \"$right\" > \"$panes/review-$i\"\n  tmux send-keys -t \"$left\"  \"$(launch \"dev-$i\" \"$wt\" \"docs/tasks.md 의 dev-$i 작업을 시작하세요. 먼저 상세 설계만 작성하고 design-$i.done 신호를 만든 뒤 멈추세요.\")\" Enter\n  tmux send-keys -t \"$right\" \"$(launch \"review-$i\" \"$wt\")\" Enter\ndone\ntmux send-keys -t \"$name:watch\" \"bash scripts/wait-and-review.sh\" Enter\necho \"실행됨. 붙기: tmux attach -t $name   (창 이동: Ctrl-b 숫자)\"\n", "start-gateway.sh": "#!/usr/bin/env bash\n# scripts/start-gateway.sh : OpenAI·Gemini 를 Anthropic 형식으로 중계하는 LiteLLM 게이트웨이 (pip install 'litellm[proxy]')\nset -euo pipefail\nroot=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\ncommand -v litellm >/dev/null || { echo \"litellm 이 없습니다: pip install 'litellm[proxy]'\" >&2; exit 1; }\nset -a\n# shellcheck disable=SC1091\n. \"$root/.agentforge/env.local\"\nset +a\nexec litellm --config \"$root/.agentforge/litellm.yaml\" --port 4000\n", "integrate.sh": "#!/usr/bin/env bash\n# scripts/integrate.sh : 통과한 feature/devN 을 develop 에 병합하고 테스트한 뒤 통합 검증 에이전트를 띄운다.\nset -euo pipefail\nroot=\"$(git rev-parse --show-toplevel)\"; cd \"$root\"\ncfg=.agentforge/forge.config.json\nn=\"$(jq -r '.developers' \"$cfg\")\"\ntest_cmd=\"$(jq -r '.commands.test // \"npm test\"' \"$cfg\")\"\ne2e_cmd=\"$(jq -r '.commands.e2e // empty' \"$cfg\")\"\nsig=\"$root/.agentforge/signals\"; log=\"$root/docs/report\"; mkdir -p \"$log\"\n\nfor i in $(seq 1 \"$n\"); do\n  [ -f \"$sig/review-$i.passed\" ] || { echo \"dev-$i 가 아직 검증을 통과하지 않았습니다.\" >&2; exit 1; }\ndone\n[ -z \"$(git status --porcelain)\" ] || { echo \"메인 폴더에 커밋하지 않은 변경이 있습니다.\" >&2; exit 1; }\n\ngit checkout develop\ngit tag -f pre-integration\nfor i in $(seq 1 \"$n\"); do\n  if ! git merge --no-ff \"feature/dev$i\" -m \"[integrator] merge feature/dev$i\"; then\n    git merge --abort\n    echo \"feature/dev$i 병합 충돌. develop 은 pre-integration 태그 상태로 유지됩니다.\" >&2\n    exit 1\n  fi\ndone\n\nstatus=0\n{ echo \"## 단위 테스트: $test_cmd\"; bash -c \"$test_cmd\"; } > \"$log/integration-test.log\" 2>&1 || status=1\nif [ -n \"$e2e_cmd\" ]; then\n  { echo \"## E2E: $e2e_cmd\"; bash -c \"$e2e_cmd\"; } >> \"$log/integration-test.log\" 2>&1 || status=1\nfi\necho \"테스트 결과: $([ $status -eq 0 ] && echo 통과 || echo 실패) (docs/report/integration-test.log)\"\n\n# shellcheck disable=SC1091\nsource \"$root/scripts/agent-env.sh\" integrator\nexec claude --agent integrator \"통합 검증을 진행하세요. docs/report/integration-test.log 를 분석해 docs/report/integration.md 를 작성하고, 실패가 있으면 원인 파일과 담당 개발자(dev-N)를 표로 정리하세요.\"\n", "agent-env.head": "#!/usr/bin/env bash\n# scripts/agent-env.sh <에이전트명> : source 해서 사용한다. 에이전트별 제공자·모델을 정한다.\n# AgentForge가 forge.config.json 의 agents 설정으로 생성한다.\n_af_root=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd)\"\n# shellcheck disable=SC1091\n[ -f \"$_af_root/.agentforge/env.local\" ] && . \"$_af_root/.agentforge/env.local\"\n\nunset ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN ANTHROPIC_MODEL CLAUDE_CODE_SUBAGENT_MODEL \\\n      ANTHROPIC_DEFAULT_OPUS_MODEL ANTHROPIC_DEFAULT_SONNET_MODEL ANTHROPIC_DEFAULT_HAIKU_MODEL\n\n_af_use() {  # _af_use <제공자> <모델>\n  local p=\"$1\" m=\"$2\" url=\"\" tok=\"\"\n  case \"$p\" in\n    claude)     export ANTHROPIC_MODEL=\"$m\"; return 0 ;;   # 사용자가 직접 로그인한 계정 사용\n    openrouter) url=\"https://openrouter.ai/api\";              tok=\"${OPENROUTER_API_KEY:-}\" ;;\n    ollama)     url=\"${OLLAMA_URL:-http://localhost:11434}\";  tok=\"ollama\" ;;\n    vllm)       url=\"${VLLM_URL:-}\";                          tok=\"${VLLM_TOKEN:-none}\" ;;\n    litellm)    url=\"${LITELLM_URL:-http://localhost:4000}\";  tok=\"${LITELLM_MASTER_KEY:-}\" ;;\n    *) echo \"알 수 없는 제공자: $p\" >&2; return 1 ;;\n  esac\n  if [ -z \"$url\" ] || [ -z \"$tok\" ]; then\n    echo \"[$p] 주소 또는 키가 비었습니다. .agentforge/env.local 을 확인하세요.\" >&2; return 1\n  fi\n  export ANTHROPIC_BASE_URL=\"$url\" ANTHROPIC_AUTH_TOKEN=\"$tok\" ANTHROPIC_API_KEY=\"\" \\\n         ANTHROPIC_MODEL=\"$m\" CLAUDE_CODE_SUBAGENT_MODEL=\"$m\" \\\n         ANTHROPIC_DEFAULT_OPUS_MODEL=\"$m\" ANTHROPIC_DEFAULT_SONNET_MODEL=\"$m\" \\\n         ANTHROPIC_DEFAULT_HAIKU_MODEL=\"$m\"\n}\n\n", "check-forge.sh": "#!/usr/bin/env bash\n# scripts/check-forge.sh : AI가 만든 에이전트·스킬·범위 파일을 기계적으로 검사한다.\nset -u\ncd \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\" || exit 1\nfail=0\nok()  { echo \"✓ $*\"; }\nerr() { echo \"✗ $*\"; fail=1; }\n\nn=\"$(jq -r '.developers' .agentforge/forge.config.json)\"\n\n# 1) CLAUDE.md 길이\nlines=\"$(wc -l < CLAUDE.md)\"\nif [ \"$lines\" -le 200 ]; then ok \"CLAUDE.md ${lines}줄\"; else err \"CLAUDE.md ${lines}줄(200줄 이하 권장)\"; fi\n\n# frontmatter의 skills 목록 추출\nskills_of() {\n  awk '/^---[[:space:]]*$/{c++; next}\n       c==1 && /^skills:/{f=1; next}\n       c==1 && f && /^[[:space:]]*-/{sub(/^[[:space:]]*-[[:space:]]*/,\"\"); print; next}\n       c==1 && f{f=0}' \"$1\"\n}\n\n# 2) 개발자별 에이전트·범위 파일·스킬 참조\nfor i in $(seq 1 \"$n\"); do\n  for a in \"dev-$i\" \"review-$i\"; do\n    f=\".claude/agents/$a.md\"\n    if [ ! -f \"$f\" ]; then err \"$f 없음\"; continue; fi\n    name=\"$(awk '/^---/{c++; next} c==1 && /^name:/{sub(/^name:[[:space:]]*/,\"\"); print; exit}' \"$f\")\"\n    [ \"$name\" = \"$a\" ] || err \"$f 의 name($name)이 파일명과 다름\"\n    [ -s \".claude/devs/$a.paths\" ] || err \".claude/devs/$a.paths 없음\"\n    for s in $(skills_of \"$f\"); do\n      [ -f \".claude/skills/$s/SKILL.md\" ] || err \"$a 가 참조한 스킬 $s 없음\"\n    done\n  done\ndone\n\n# 3) 개발자 사이 담당 범위 겹침\ntmp=\"$(mktemp)\"\nfor i in $(seq 1 \"$n\"); do\n  sed 's/#.*//; s/[[:space:]]//g; /^$/d' \".claude/devs/dev-$i.paths\" 2>/dev/null | sed \"s/^/dev-$i /\"\ndone > \"$tmp\"\nwhile read -r a p; do\n  while read -r b q; do\n    [ \"$a\" \\< \"$b\" ] || continue\n    case \"$p\" in \"$q\"*) err \"범위 겹침: $a($p) / $b($q)\"; continue;; esac\n    case \"$q\" in \"$p\"*) err \"범위 겹침: $a($p) / $b($q)\";; esac\n  done < \"$tmp\"\ndone < \"$tmp\"\nrm -f \"$tmp\"\n\n# 4) 스킬 name = 폴더명\nfor d in .claude/skills/*/; do\n  s=\"$(basename \"$d\")\"\n  name=\"$(awk '/^---/{c++; next} c==1 && /^name:/{sub(/^name:[[:space:]]*/,\"\"); print; exit}' \"$d/SKILL.md\")\"\n  [ \"$name\" = \"$s\" ] || err \"스킬 $s 의 name($name) 불일치\"\ndone\n\n# 5) hook 실행 권한\n[ -x .claude/hooks/guard-paths.sh ] || err \"guard-paths.sh 실행 권한 없음(chmod +x)\"\n\n# 6) PRD 기능 ID가 모두 배정되었는지\nif [ -f docs/prd.md ] && [ -f docs/tasks.md ]; then\n  mapfile -t ids < <(grep -oE 'F-[0-9]{3}' docs/prd.md | sort -u)\n  for id in \"${ids[@]}\"; do\n    grep -q \"$id\" docs/tasks.md || err \"$id 가 docs/tasks.md 에 배정되지 않음\"\n  done\nelse\n  err \"docs/prd.md 또는 docs/tasks.md 가 없습니다(기획·분석 단계 먼저)\"\nfi\n\nif [ \"$fail\" -eq 0 ]; then echo \"검증 통과\"; else echo \"검증 실패: 위 항목을 고친 뒤 다시 실행\"; exit 1; fi\n", "run-role.sh": "#!/usr/bin/env bash\n# scripts/run-role.sh <에이전트> [첫 프롬프트] : 순차 단계 에이전트를 현재 터미널에서 실행\nset -euo pipefail\nroot=\"$(git rev-parse --show-toplevel)\"; cd \"$root\"\n# shellcheck disable=SC1091\nsource scripts/agent-env.sh \"$1\"\nexec claude --agent \"$1\" ${2:+\"$2\"}\n", "md/review.tpl.md": "---\nname: review-{{N}}\ndescription: dev-{{N}}의 짝 검증자. dev-{{N}}의 상세 설계와 코드를 검토하고 통과 또는 반려를 판정한다.\ntools: Read, Grep, Glob, Write, Bash\nmodel: {{MODEL}}\nskills:\n  - conventions\n  - code-review\n{{SKILLS}}---\n너는 review-{{N}}이다. 코드를 고치지 않는다. 쓸 수 있는 파일은 docs/review/dev-{{N}}.md 뿐이다.\n\n## 설계 검토 (요청: \"설계 검토\")\n- docs/design/detail/dev-{{N}}.md 가 시스템 설계·API 계약{{UI_READ}}과 맞는지, 담당 기능 ID를 빠짐없이 다루는지 본다.\n- 결과를 docs/review/dev-{{N}}.md 에 쓰고 `touch \"$AF_SIGNALS/design-{{N}}.pass\"` 또는 `design-{{N}}.reject`.\n\n## 코드 검토 (요청: \"코드 검토\")\n- 테스트를 직접 실행한다. 실패가 하나라도 있으면 반려.\n- `git diff --name-only develop...HEAD` 로 담당 범위 밖 변경이 있는지 확인한다. 있으면 반려.\n- code-review 스킬 기준으로 판정하고 `review-{{N}}.pass` 또는 `review-{{N}}.reject`.\n", "md/forge-init.md": "---\nname: forge-init\ndescription: 요구사항 파일로 PRD와 CLAUDE.md 프로젝트 구간을 생성한다. 사용자가 /forge-init 을 입력했을 때만 사용한다.\ndisable-model-invocation: true\nallowed-tools: Read, Write, Edit, Glob\n---\n# 입력\n- .agentforge/requirements.md : 사용자 요구사항 원문\n- .agentforge/forge.config.json : 개발자 수, UI/UX 설계 여부(uiDesign), 언어\n- .agentforge/templates/prd.md : PRD 양식(장 순서 고정)\n\n# 절차\n1. 요구사항을 읽고 모호한 점을 최대 5개 질문한다. 답을 받기 전에는 파일을 쓰지 않는다.\n2. 양식의 장 순서대로 docs/prd.md 를 쓴다.\n   - 기능마다 ID(F-001부터), 우선순위(필수/선택), 수용 기준(Given/When/Then)을 단다.\n   - uiDesign 이 false 이면 화면 장은 \"해당 없음\"으로 둔다.\n3. CLAUDE.md 의 <!-- AGENTFORGE:PROJECT:BEGIN --> ~ END 구간만 교체한다.\n   - 프로젝트 소개 1줄, 기술 스택, 설치·테스트·빌드 명령어, 폴더 구조.\n   - 다른 구간과 고정 규칙은 수정하지 않는다. CLAUDE.md 전체는 200줄을 넘기지 않는다.\n4. 끝에 \"사람이 확인할 항목\"(가정한 내용, 기술 선택 근거)을 목록으로 출력한다.\n\n# 금지\n- 요구사항에 없는 기능 추가. 필요해 보이면 \"제안\" 절에만 적는다.\n- 일정·인원 같은 숫자를 근거 없이 쓰기.\n", "md/architect.md": "---\nname: architect\ndescription: 시스템 설계 단계. 모듈 경계, API 계약, 데이터 모델, 폴더 소유를 정한다.\ntools: Read, Write, Edit, Glob, Grep\nmodel: {{MODEL}}\n---\n입력: docs/prd.md, docs/tasks.md, docs/design/ui/(있으면)\n산출물: docs/design/system.md, API 계약 파일(openapi.yaml 또는 타입 정의), 데이터 모델, docs/adr/0001-*.md\n규칙:\n- docs/design/ui/data-needs.md 의 모든 화면 데이터가 계약의 어느 API로 채워지는지 대응표를 system.md 에 둔다.\n- 개발자 사이에 오가는 모든 호출은 계약 파일에 있어야 한다. 구두 약속 금지.\n- docs/tasks.md 의 담당 폴더와 실제 폴더 구조가 일치해야 한다. 다르면 tasks.md 를 고치고 변경 사유를 ADR에 적는다.\n- 다른 개발자가 아직 만들지 않은 API를 쓸 수 있게 목(mock) 응답 예를 계약에 넣는다.\n- 화면 요구를 바꿔야 하면 직접 고치지 말고 \"UI/UX 변경 요청\"으로 보고한다.\n", "md/forge-agents.md": "---\nname: forge-agents\ndescription: 분석(docs/tasks.md)과 시스템 설계가 끝난 뒤 개발자별 에이전트, 짝 검증 에이전트, 개발자 전용 스킬, 담당 범위 파일을 생성·보완한다. 사용자가 /forge-agents 를 입력했을 때만 사용한다.\ndisable-model-invocation: true\nallowed-tools: Read, Write, Edit, Glob, Bash(bash scripts/check-forge.sh)\n---\n# 입력\n- .agentforge/forge.config.json 의 developers(N), agents(에이전트별 모델)\n- docs/tasks.md : 작업 ID, 기능 ID, 담당 개발자, 담당 폴더\n- docs/design/system.md, API 계약 파일, docs/design/ui/(있으면)\n- .agentforge/templates/dev.md, review.md, dev-skill.md\n\n# 절차 (i = 1..N)\n1. tasks.md 에서 dev-i 의 기능 ID·담당 폴더·도메인명을 뽑는다. 담당 폴더가 다른 개발자와 겹치면 파일을 만들지 말고 겹치는 목록을 보고한 뒤 멈춘다.\n2. 이미 .claude/agents/dev-i.md 가 있으면 담당 기능·폴더만 tasks.md 기준으로 고친다. 없으면 템플릿의 {{N}} {{DOMAIN}} {{FEATURES}} {{PATHS}} 를 채워 만든다. frontmatter 키와 작업 순서는 바꾸지 않는다. review-i.md 도 같다.\n3. .claude/devs/dev-i.paths(담당 폴더 + docs/design/detail/dev-i.md + docs/report-dev-i.md), review-i.paths(docs/review/dev-i.md)를 만든다.\n4. .claude/skills/devi-<도메인>/SKILL.md 의 빈 절을 채운다(없으면 만든다).\n   - description 첫 문장: \"dev-i 담당 작업에서만 사용한다.\"\n   - 본문: 도메인 용어, 업무 규칙, 담당 API·테이블, 테스트 데이터 예. 500줄 이하. PRD·설계에 없는 규칙을 만들지 않는다.\n5. CLAUDE.md 의 AGENTFORGE:DEVS / SKILLS 구간 표를 갱신한다.\n6. bash scripts/check-forge.sh 를 실행한다. 실패하면 고치고 다시 실행한다. 3회 연속 실패하면 멈추고 보고한다.\n", "md/planner.md": "---\nname: planner\ndescription: 기획 단계. 요구사항을 PRD로 만들고 기능 ID를 부여한다.\ntools: Read, Write, Edit, Glob, Grep\nmodel: {{MODEL}}\n---\n너는 기획 담당이다. /forge-init 스킬 절차를 따른다.\n산출물: docs/prd.md, CLAUDE.md 의 PROJECT 구간. 코드는 쓰지 않는다.\n", "md/analyst.md": "---\nname: analyst\ndescription: 분석 단계. PRD 기능을 작업으로 분해하고 공통/개발자별로 배정한다.\ntools: Read, Write, Edit, Glob, Grep\nmodel: {{MODEL}}\n---\n입력: docs/prd.md, .agentforge/forge.config.json(developers=N)\n산출물: docs/analysis.md(기능 간 의존성, 위험), docs/tasks.md\ndocs/tasks.md 형식:\n| 작업 ID | 기능 ID | 담당 | 도메인 | 담당 폴더 | 선행 |\n규칙:\n- 여러 개발자가 쓰는 것(타입, 인증, 공통 UI, DB 스키마)은 담당을 common 으로 둔다.\n- 나머지는 도메인 단위로 dev-1..dev-N 에 나눠 배정한다. 폴더가 겹치면 안 된다.\n- 작업량이 한 개발자에 몰리면(최대/최소 1.5배 초과) 재배정하고 사유를 적는다.\n- PRD의 모든 기능 ID가 한 번 이상 배정되어야 한다.\n", "md/code-review.md": "---\nname: code-review\ndescription: 개발 검증 기준과 판정 규칙. review-* 에이전트가 설계·코드를 검토할 때 사용한다.\n---\n# 반려 사유 (하나라도 있으면 reject)\n- 테스트 실패, 또는 상세 설계 6장의 테스트가 없음\n- 담당 범위 밖 파일 변경\n- 계약과 다른 요청·응답 형식\n- 수용 기준 미충족, 오류 처리 누락, 비밀 값 하드코딩\n# 기록 (docs/review/dev-N.md)\n| 판정 | 파일:줄 | 문제 | 고칠 방법 |\n- 지적은 고칠 수 있게 구체적으로. 취향 문제(이름 스타일 등)는 반려 사유가 아니다.\n", "md/tdd.md": "---\nname: tdd\ndescription: 테스트 먼저 작성 → 실패 확인 → 구현 → 통과 확인 순서. 기능 코드를 작성하는 에이전트가 사용한다.\n---\n# TDD 절차\n1. 상세 설계 6장(테스트 목록)의 테스트를 먼저 작성한다.\n2. 테스트를 실행해 실패를 확인한다. 실패하지 않으면 테스트가 잘못된 것이다.\n3. 테스트를 통과하는 최소 구현을 한다.\n4. 전체 테스트를 다시 실행한다. 다른 테스트가 깨지면 고친 뒤 커밋한다.\n- 외부 API는 계약의 목(mock) 응답으로 대체한다.\n", "md/integrator.md": "---\nname: integrator\ndescription: 통합 검증 단계. 병합 후 테스트 로그를 분석하고 실패 원인을 담당 개발자별로 정리한다.\ntools: Read, Grep, Glob, Write, Bash\nmodel: {{MODEL}}\nskills:\n  - code-review\n---\n산출물: docs/report/integration.md\n절차:\n1. docs/report/integration-test.log 를 읽는다.\n2. 실패한 테스트마다 원인 파일을 찾고, .claude/devs/*.paths 로 담당 개발자를 정한다.\n3. 원인이 API 계약 불일치면 \"시스템 설계\", 화면 요구 누락이면 \"UI/UX 설계\" 문제로 분류한다.\n4. PRD 기능 ID별 수용 기준 충족 여부를 표로 정리한다.\n코드는 고치지 않는다. 고칠 개발자와 내용만 적는다.\n", "md/devskill.tpl.md": "---\nname: {{SKILL}}\ndescription: dev-{{N}} 담당 작업에서만 사용한다. {{DOMAIN}} 도메인의 용어, 업무 규칙, 담당 API·테이블, 테스트 데이터.\n---\n# {{DOMAIN}} 도메인 (dev-{{N}})\n\n> /forge-agents 가 분석·시스템 설계 결과로 아래 항목을 채운다. PRD·설계에 없는 규칙은 쓰지 않는다.\n\n## 용어\n## 업무 규칙\n## 담당 API·테이블\n## 테스트 데이터 예\n", "md/prd.tpl.md": "# PRD — {{NAME}}\n\n> /forge-init 이 .agentforge/requirements.md 를 바탕으로 채운다. 장 순서는 바꾸지 않는다.\n\n## 1. 개요\n- 목적:\n- 사용자:\n- 범위 / 범위 밖:\n\n## 2. 기능 목록\n| 기능 ID | 기능 | 우선순위 | 수용 기준(Given/When/Then) |\n| --- | --- | --- | --- |\n\n## 3. 화면\n{{UI_NOTE}}\n\n## 4. 데이터\n- 주요 엔터티와 관계:\n\n## 5. 비기능 요구\n- 성능 / 보안 / 운영 환경(폐쇄망 여부 포함):\n\n## 6. 기술 조건과 제약\n- 기술 스택 / 연동 시스템:\n\n## 7. 미결 사항\n| 번호 | 내용 | 확인 대상 |\n| --- | --- | --- |\n", "md/common-dev.md": "---\nname: common-dev\ndescription: 공통 개발 단계. docs/tasks.md 의 common 작업(공통 타입, 인증, 공통 UI, 목 API, CI)을 구현한다.\ntools: Read, Grep, Glob, Edit, Write, Bash\nmodel: {{MODEL}}\nskills:\n  - conventions\n  - tdd\n---\n규칙:\n- API 계약에서 타입을 생성하거나 직접 정의해 공통 폴더에 둔다. 개발자들은 이것만 import 한다.\n- 각 개발자 담당 폴더는 빈 폴더(.gitkeep)와 진입점만 만든다. 내용을 미리 구현하지 않는다.\n- 빌드·테스트 명령이 통과해야 끝난다. CI 설정을 포함한다.\n", "md/detail-design.md": "---\nname: detail-design\ndescription: 개발자의 상세 설계 양식. dev-* 에이전트가 구현 전에 docs/design/detail/dev-N.md 를 쓸 때 사용한다.\n---\n# 상세 설계 양식 (docs/design/detail/dev-N.md)\n1. 담당 작업·기능 ID 목록\n2. 파일 목록: 만들 파일 경로와 책임 한 줄 (모두 담당 범위 안)\n3. 주요 함수·클래스: 시그니처, 입력 검증, 오류 처리\n4. 사용하는 계약: 호출하는 API·제공하는 API (계약 파일의 이름 그대로)\n5. 화면 상태(화면이 있을 때): 로딩/빈 값/오류/성공\n6. 테스트 목록: 기능 ID별 수용 기준 → 테스트 이름\n7. 계약·공통 모듈에 필요한 변경(있으면 구현 전에 멈추고 보고)\n", "md/conventions.md": "---\nname: conventions\ndescription: 프로젝트 공통 작업 규칙(언어, 커밋, 보고서 형식). 모든 개발·검증 에이전트가 사용한다.\n---\n# 공통 작업 규칙\n- 답변·문서는 {{LANG}}, 코드 식별자는 영어.\n- 커밋 메시지: `[에이전트] 작업ID 요약` (예: `[dev-1] T-101 주문 목록 조회`)\n- 한 커밋에는 한 작업 ID만 담는다.\n- 완료 보고 docs/report-<에이전트>.md\n  | 작업 ID | 결과 | 변경 파일 | 테스트 | 남은 문제 |\n- 비밀 값(키, 비밀번호)을 코드·문서·로그에 쓰지 않는다.\n", "md/ux-designer.md": "---\nname: ux-designer\ndescription: UI/UX 설계 단계(선택). 화면 목록, 와이어프레임, 디자인 토큰, 화면별 필요 데이터를 만든다.\ntools: Read, Write, Edit, Glob, Grep\nmodel: {{MODEL}}\n---\n입력: docs/prd.md, docs/tasks.md\n산출물:\n- docs/design/ui/screens.md : 화면 ID ↔ 기능 ID ↔ 담당 dev, 화면 흐름\n- docs/design/ui/wireframes/*.md : 텍스트 와이어프레임, 상태(로딩/빈 값/오류/성공)\n- docs/design/ui/data-needs.md : 화면별 조회·입력 데이터 항목과 동작(시스템 설계의 입력)\n- docs/design/ui/tokens.json : 색·글꼴·간격\n규칙:\n- API 형식을 정하지 않는다. \"무엇이 필요한가\"만 적고, 어떻게 주고받을지는 architect 가 정한다.\n- 공통 컴포넌트(버튼, 표, 폼, 레이아웃)는 목록만 정하고 구현은 common-dev 가 한다.\n", "md/dev.tpl.md": "---\nname: dev-{{N}}\ndescription: 개발자 {{N}}. {{DOMAIN}} 도메인({{PATHS_INLINE}})의 상세 설계와 구현을 담당한다. docs/tasks.md의 dev-{{N}} 항목만 처리한다.\ntools: Read, Grep, Glob, Edit, Write, Bash\nmodel: {{MODEL}}\nskills:\n  - conventions\n  - tdd\n  - detail-design\n{{SKILLS}}---\n너는 dev-{{N}}이다. 담당 범위는 .claude/devs/dev-{{N}}.paths 에 적힌 경로뿐이다.\n담당 기능: {{FEATURES}}\n\n## 작업 순서\n1. docs/tasks.md 에서 dev-{{N}} 작업 ID를 확인한다. docs/design/system.md 와 API 계약{{UI_READ}}을 읽는다.\n2. detail-design 스킬 양식으로 docs/design/detail/dev-{{N}}.md 를 쓴다.\n3. `touch \"$AF_SIGNALS/design-{{N}}.done\"` 을 실행하고 멈춘다. 구현하지 않는다.\n4. \"설계 승인\" 메시지를 받으면 테스트를 먼저 쓰고 구현한다.\n5. 테스트가 모두 통과하면 커밋하고 docs/report-dev-{{N}}.md 를 쓴 뒤 `touch \"$AF_SIGNALS/dev-{{N}}.done\"`.\n6. \"반려\" 메시지를 받으면 docs/review/dev-{{N}}.md 를 읽고 지적 사항만 고친 뒤 5를 반복한다.\n\n## 금지\n- 담당 범위 밖 파일 수정. 필요하면 report에 적고 멈춘다.\n- API 계약·공통 모듈 변경. 읽기만 한다.\n"};

function seqAgent(id){
  let s = STATIC["md/" + id + ".md"].replace("{{MODEL}}", fmModel(S.agents[id]));
  if(id === "common-dev" && !S.skills.tdd) s = s.replace("  - tdd\n", "");
  if(id === "common-dev" && !S.skills.conventions) s = s.replace("  - conventions\n", "");
  return s;
}
function skillList(base, extra){ return [...base, ...extra].map(x => `  - ${x}\n`).join(""); }
function devAgent(d, i){
  const n = String(i + 1), ps = pathsOf(d);
  const extra = [devSkill(d, i), ...importedFor("dev")];
  let s = STATIC["md/dev.tpl.md"];
  if(!S.skills.tdd) s = s.replace("  - tdd\n", "");
  if(!S.skills.conventions) s = s.replace("  - conventions\n", "");
  return s.replaceAll("{{N}}", n).replaceAll("{{DOMAIN}}", d.domain.trim()).replaceAll("{{PATHS_INLINE}}", ps.join(", "))
    .replace("{{MODEL}}", fmModel({p:d.dp, m:d.dm})).replace("{{SKILLS}}", skillList([], extra))
    .replace("{{FEATURES}}", `docs/tasks.md 의 dev-${n} 항목(분석 후 /forge-agents 가 기능 ID로 갱신)`)
    .replaceAll("{{UI_READ}}", S.ui ? ", docs/design/ui/" : "");
}
function reviewAgent(d, i){
  const n = String(i + 1);
  let s = STATIC["md/review.tpl.md"];
  if(!S.skills.conventions) s = s.replace("  - conventions\n", "");
  return s.replaceAll("{{N}}", n).replace("{{MODEL}}", fmModel({p:d.rp, m:d.rm}))
    .replace("{{SKILLS}}", skillList([], [devSkill(d, i), ...importedFor("review")])).replaceAll("{{UI_READ}}", S.ui ? "·화면 설계" : "");
}
function genAgentEnv(){

  };
  return STATIC["agent-env.head"] + `\ncase "\${1:?에이전트명을 넣으세요}" in\n` +
    allAgents().map(([n, a]) => line(n, a)).join("\n") + `\n  ${"*)".padEnd(14)} _af_use claude sonnet ;;\nesac\n`;

function genLitellm(){

function checks(){

    <label class="f">공개 범위<select id="g-vis" data-bind="gh.visibility"><option value="private" ${S.gh.visibility === "private" ? "selected" : ""}>비공개</option><option value="public" ${S.gh.visibility === "public" ? "selected" : ""}>공개</option></select></label>
  </div>
  <div class="row"><button type="button" data-act="ghplan">호출 계획 보기</button><span class="sub">PoC는 토큰을 받지 않고 전송하지 않습니다.</span></div>
  <div id="ghplan"></div>${navBtns()}`;
}
function renderPanel(){ $("#panel").innerHTML = [p0, p1, p2, p3, p4, p5][S.step](); }
function renderPreview(){
  const F = buildFiles();
  if(!F.some(f => f.path === S.sel)) S.sel = "CLAUDE.md";
  $("#fileCount").textContent = `${F.length}개`;
  $("#tree").innerHTML = F.map(f => `<button type="button" data-act="sel" data-p="${esc(f.path)}" ${f.path === S.sel ? 'aria-current="true"' : ""}><span>${esc(f.path)}</span><span>${f.ai ? '<span class="ai">AI</span> ' : ""}${f.exec ? '<span class="x">755</span>' : ""}</span></button>`).join("");
  const cur = F.find(f => f.path === S.sel);
  $("#selPath").textContent = cur.path; $("#view").textContent = cur.content || "(빈 파일)";
}
function renderAll(){ renderSteps(); renderPanel(); renderPreview(); save(); }

/* ---------- 이벤트 ---------- */
function setPath(path, val){ const k = path.split("."); let o = S; while(k.length > 1) o = o[k.shift()]; o[k[0]] = val; }
function refocus(id){ const f = document.getElementById(id); if(f){ f.focus(); if(f.type === "text") f.setSelectionRange(f.value.length, f.value.length); } }
document.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.bind){
    setPath(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value);
    if(el.dataset.re){ renderPanel(); refocus(el.id); }
    renderSteps(); renderPreview(); save(); return;
  }
  if(el.dataset.agent || el.dataset.dev){
    const f = el.dataset.field, tgt = el.dataset.agent ? S.agents[el.dataset.agent] : S.devs[+el.dataset.dev];
    tgt[f] = el.value;
    const pf = {p:"m", dp:"dm", rp:"rm"}[f];
    if(pf){ tgt[pf] = prov(el.value).models[el.value === "claude" ? 1 : 0] || ""; renderPanel(); refocus(el.id); }
    renderSteps(); renderPreview(); save(); return;
  }
  if(el.dataset.skill){ S.skills[el.dataset.skill] = el.checked; renderPreview(); save(); return; }
  if(el.dataset.target){ const m = S.imported.find(x => x.id === el.dataset.target); if(m) m.target = el.value; renderPreview(); save(); return; }
  if(el.dataset.ack){ S.ack[el.dataset.ack] = el.checked; renderSteps(); save(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.dev && (el.dataset.field === "domain" || el.dataset.field === "paths")){ renderPanel(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a === "go"){ S.step = Math.max(0, Math.min(STEPS.length - 1, +b.dataset.i)); renderAll(); window.scrollTo({top:0}); }
  else if(a === "dev"){ S.devCount = Math.max(1, Math.min(6, S.devCount + +b.dataset.d)); syncDevs(); renderAll(); }
  else if(a === "sel"){ S.sel = b.dataset.p; renderPreview(); save(); }
  else if(a === "import"){ const m = MARKET.find(x => x.id === b.dataset.id); if(!m) return;
    S.imported.push(Object.assign({target:"all"}, m)); renderAll(); toast(`${m.id} 를 가져왔습니다`); }
  else if(a === "unimport"){ S.imported = S.imported.filter(x => x.id !== b.dataset.id); delete S.ack[b.dataset.id]; renderAll(); }
  else if(a === "zip"){ exportZip(); }
  else if(a === "ghplan"){ ghPlan(); }
});
$("#hdrZip").addEventListener("click", exportZip);
$("#copyBtn").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText($("#view").textContent); toast("복사했습니다"); }
  catch(err){ const r = document.createRange(); r.selectNodeContents($("#view")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("선택했습니다. Ctrl+C로 복사하세요"); }
});
let tT; function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- 내보내기 ---------- */
const dlP = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
async function exportZip(){
  const msg = t => { const z = $("#zipMsg"); if(z) z.textContent = t; };
  if(checks().some(c => c[0] === "er")){ S.step = 5; renderAll(); toast("✕ 항목을 먼저 해결하세요"); return; }
  if(typeof JSZip === "undefined"){ toast("ZIP 라이브러리를 불러오지 못했습니다"); return; }
  const dl = await dlP;
  if(!dl){ toast("이 화면에서는 다운로드를 쓸 수 없습니다. 오른쪽에서 파일별로 복사하세요."); msg("다운로드 사용 불가"); return; }
  const root = slug(), zip = new JSZip();
  buildFiles().forEach(f => zip.file(root + "/" + f.path, f.content, {unixPermissions: f.exec ? 0o755 : 0o644}));
  msg("압축 중…");
  const blob = await zip.generateAsync({type:"blob", platform:"UNIX"});
  try{ await dl.save({filename: root + "-agentforge.zip", data: blob}); msg("저장했습니다"); toast("ZIP을 저장했습니다"); }
  catch(err){ const c = err && err.code; msg(c === "declined" ? "저장을 취소했습니다" : c === "rate_limited" ? "잠시 후 다시 시도하세요" : "다운로드할 수 없습니다"); }
}
function ghPlan(){
  const F = buildFiles(), ex = F.filter(f => f.exec).length, o = S.gh.owner || "my-org", r = S.gh.repo || slug();
  $("#ghplan").innerHTML = `<div class="plan"><b>실행될 GitHub API 호출 (시연)</b>
    <span>1. POST /orgs/${esc(o)}/repos  {name:"${esc(r)}", private:${S.gh.visibility === "private"}, auto_init:true}</span>
    <span>2. POST /repos/${esc(o)}/${esc(r)}/git/blobs × ${F.length}</span>
    <span>3. POST /repos/${esc(o)}/${esc(r)}/git/trees  (mode 100755 × ${ex}, 100644 × ${F.length - ex})</span>
    <span>4. POST /repos/${esc(o)}/${esc(r)}/git/commits  "[lead] AgentForge 환경 생성"</span>
    <span>5. PATCH /repos/${esc(o)}/${esc(r)}/git/refs/heads/main</span>
    <span style="color:var(--muted)">env.local 은 포함하지 않습니다. 키는 저장소에 올라가지 않습니다.</span></div>`;
}

renderAll();
})();
</script>
