name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    # 생성 스크립트 호환(macOS·Linux) 확인을 위해 두 OS 에서 실행한다
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:poc-static
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: 스크립트 검사 도구 설치 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats jq tmux
      - name: 스크립트 검사 도구 설치 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck bats-core jq tmux bash
          # 생성 스크립트는 bash 4+ 전제(PRD 호환) — 기본 bash 3.2 대신 brew bash 를 PATH 앞에
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: pnpm test:scripts
      - name: E2E 브라우저 설치 (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # PH5 실기 점검(T-501): Dev Container 환경 칸. 표준 devcontainer 이미지 안에서 구성 3종 주기를 돌린다
  realdevice-devcontainer:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/javascript-node:22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: apt-get update && apt-get install -y tmux jq bats unzip
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bats tests/scripts/realdevice.bats
      # VSC-02(T-613): 생성 devcontainer.json 의 postCreateCommand 를 이 이미지 안에서 실행해 tmux·jq·claude 동작 확인
      - name: Dev Container 생성물 동작 확인
        env:
          AF_IN_DEVCONTAINER_IMAGE: "1"
          AF_DEVCONTAINER_REQUIRED: "1"
        run: bash tests/scripts/devcontainer-check.sh

  # PH8 DPL-01(T-813): Docker 이미지 빌드 후 외부 차단 네트워크(--internal)에서 설치형 동작 확인
  airgap-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 폐쇄망 설치 시험
        env:
          AF_AIRGAP_REQUIRED: "1"
        run: bash tests/scripts/airgap-check.sh
